buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = 'https://maven.minecraftforge.net/'
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = project.mod_version
group = project.mod_package_name
archivesBaseName = project.mod_name

sourceCompatibility = targetCompatibility = 1.8

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false

    ['mod_id', 'mod_name', 'mod_version', 'mod_url', 'target_mwe_version'].each { property ->
        replace "@${property.toUpperCase()}@", project.hasProperty(property) ? project[property] : null
    }
}

runClient {
    outputs.upToDateWhen { false }
    jvmArgs += [
            "-Dmwe.disableUpdater=true",
            "-Dconfig.lib.showHidden=true"
            , "-Dmwe.asm.classdump=true"
    ]
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compile "com.github.Alexdoru:MWE:${project.target_mwe_version}"
}

processResources {
    def propertyMap = (file('src/main/resources/mcmod.info').text =~ /\$\{([\w.]+)}/)
            .collect { it[1] }
            .unique()
            .collectEntries { [(it): project.hasProperty(it) ? project[it] : it] }

    inputs.properties propertyMap

    filesMatching('mcmod.info') {
        expand propertyMap
    }
}

jar {
    manifest.attributes(
            "FMLCorePlugin": "${project.mod_package_name}.AddonBootstrap",
            "FMLCorePluginContainsFMLMod": "true"
    )
}